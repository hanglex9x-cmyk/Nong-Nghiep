<style>

.bar{height:9px;border-radius:99px;background:var(--gray-soft);overflow:hidden} .bar i{display:block;height:100%;border-radius:99px;background:var(--green)} .bar i.amber{background:var(--amber)} .bar i.red{background:var(--red)}

.panel h4{margin:0 0 12px;font-size:16px;font-weight:700} .panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px} .panel-head h4{margin:0}
.warn{background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);padding:11px 14px;border-radius:12px;font-size:13.5px;margin:6px 0 12px;line-height:1.55}
.note{font-size:13px;color:var(--ink2);margin-top:8px;line-height:1.55} .err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
#loginBox{max-width:380px;margin:8vh auto;background:var(--surface);border:1px solid var(--line);padding:28px;border-radius:var(--radius);box-shadow:var(--shadow)}
#loginBox h1{font-size:20px;margin:0 0 4px;color:var(--brand-deep);font-weight:800;letter-spacing:-.01em} #loginBox p{margin:0 0 16px;color:var(--ink2);font-size:13px}

.toast.show{opacity:1;transform:translateX(-50%) translateY(0)} @media (min-width:1025px){.toast{bottom:28px}}
.bottomnav{display:none}
@media (max-width:1024px){.app{grid-template-columns:1fr}.sidebar{display:none}.main{padding:0 15px 96px}.bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:6px 2px calc(6px + env(safe-area-inset-bottom));overflow-x:auto}.bottomnav button{flex:0 0 auto;min-width:64px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;line-height:1.2;text-align:center;font-weight:600;color:var(--ink3);padding:5px 6px;cursor:pointer;border-radius:9px}.bottomnav button.on{color:var(--brand)}.topbar h1{font-size:18px}}
.sec-title{font-size:17px;font-weight:800;margin:22px 0 10px} .sec-title:first-child{margin-top:0}
.hbars{display:flex;flex-direction:column;gap:11px}
.leaflet-tooltip.lo-label{background:rgba(255,255,255,.88);border:1px solid var(--line);font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700}
</style>

<body>

  <button class="on" data-pg="dashboard" onclick="go('dashboard',this)">📊<span>Tổng quan</span></button>

<div class="toast" id="toast"></div>

<script>
var API_BASE='https://script.google.com/macros/s/AKfycbx7KJtZDvyiQDLiRukt9QMx6yX_oM55on7WHky036wWXjfmLp99A9KhvdctqUbl8Dma0A/exec';
var TOKEN=localStorage.getItem('thym_token')||'';
var USER=null, INIT=null, VUNG=[], LO=[], CUR_VUNG='TATCA', MAP_OBJ=null, MAP_INIT=false;
try{ USER=JSON.parse(localStorage.getItem('thym_user')||'null'); }catch(e){ USER=null; }

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},3200);}
function fmt(n,dec){if(n===null||n===undefined||n==='')return '—';var x=Number(n);if(isNaN(x))return n;return x.toLocaleString('vi-VN',{minimumFractionDigits:dec||0,maximumFractionDigits:dec||0});}
function esc(s){return String(s===null||s===undefined?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function forceLogout(){localStorage.removeItem('thym_token');localStorage.removeItem('thym_user');TOKEN='';USER=null;document.getElementById('app').classList.add('hidden');document.getElementById('bottomNav').classList.add('hidden');document.getElementById('loginBox').classList.remove('hidden');}
async function rpc(fn){
  var args=Array.prototype.slice.call(arguments,1);
  var body=JSON.stringify({fn:fn,args:args});
  var lastErr=null;
  for(var attempt=0;attempt<3;attempt++){
    var j=null;
    try{
      var r=await fetch(API_BASE,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body});
      j=await r.json();
    }catch(e){ j=null; lastErr=e; }
    if(j&&typeof j.ok!=='undefined'){
      if(!j.ok){ var msg=j.error||'Lỗi không xác định'; if(String(msg).indexOf('Phien dang nhap het han')>=0){ forceLogout(); } throw new Error(msg); }
      return j.data;
    }
    if(attempt<2) await new Promise(function(res){ setTimeout(res,700*(attempt+1)); });
  }
  throw lastErr||new Error('Khong ket noi duoc may chu (phan hoi rong)');
}
function run(fn){ var a=Array.prototype.slice.call(arguments,1); return rpc.apply(null,[fn].concat(a)); }

async function doLogin(){
  var u=document.getElementById('lgUser').value.trim(), p=document.getElementById('lgPass').value;
  var err=document.getElementById('lgErr'); err.textContent='';
  try{ var s=await rpc('dangNhap',u,p); TOKEN=s.token; localStorage.setItem('thym_token',TOKEN); localStorage.setItem('thym_user',JSON.stringify({ten:s.ten,role:s.role,vung:s.vung})); await boot(); }
  catch(e){ err.textContent=e.message; }
}
async function doLogout(){ try{ await rpc('dangXuat',TOKEN); }catch(e){} forceLogout(); location.reload(); }
async function boot(){
  INIT=await rpc('getInitData',TOKEN);
  USER=INIT.user; VUNG=INIT.vung||[]; LO=INIT.lo||[];
  localStorage.setItem('thym_user',JSON.stringify(USER));
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('bottomNav').classList.remove('hidden');
  document.getElementById('uinfo').innerHTML=esc(USER.ten||USER.u||'')+'<br>Vai trò: '+esc(USER.role||'')+(USER.vung?'<br>Vùng phụ trách: '+esc(USER.vung):'');
  loadDashboard();
}
var TITLES={dashboard:'Dashboard CEO',vunglo:'Vùng & Lô',canxe:'Cân xe nhập cỏ/ngô',giomay:'Giờ máy',dau:'Dầu diesel',bon:'Bón phân',sanluong:'Sản lượng',bando:'Bản đồ vệ tinh & polygon lô'};
function go(pg,btn){
  document.querySelectorAll('#app .view').forEach(function(s){s.classList.remove('on');});
  document.getElementById('pg-'+pg).classList.add('on');
  document.querySelectorAll('.nav button, .bottomnav button').forEach(function(n){ if(n.getAttribute('data-pg')===pg) n.classList.add('on'); else if(n.getAttribute('data-pg')) n.classList.remove('on'); });
  document.getElementById('viewTitle').textContent=TITLES[pg]||pg;
  if(pg==='dashboard') loadDashboard();
  if(pg==='vunglo') loadVungLo();
  if(pg==='canxe') loadCanXe();
  if(pg==='giomay') loadGioMay();
  if(pg==='dau') loadDau();
  if(pg==='bon') loadBon();
  if(pg==='sanluong') loadTablePage('sanluong','SanLuong','🌾 Sản lượng theo tháng × vùng/lô');
  if(pg==='bando') loadBanDo();
}

/* Excel — SheetJS lazy nhu ban chinh */
var LASTROWS={}; var XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
function ensureXLSX(){return new Promise(function(res,rej){ if(window.XLSX) return res(); var s=document.createElement('script'); s.src=XLSX_URL; s.onload=function(){res();}; s.onerror=function(){rej(new Error('Khong tai duoc thu vien Excel (CDN)'));}; document.head.appendChild(s); });}
function ngayFile(){var d=new Date();function p(x){return (x<10?'0':'')+x;} return ''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());}
function taiXuong(name,aoa){return ensureXLSX().then(function(){var ws=XLSX.utils.aoa_to_sheet(aoa);var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'DuLieu');XLSX.writeFile(wb,name+'_'+ngayFile()+'.xlsx');});}
function xuatRows(name,rows){ if(!rows||!rows.length){toast('Chua co du lieu de xuat.');return;} var head=Object.keys(rows[0]); var aoa=[head].concat(rows.map(function(r){return head.map(function(h){var v=r[h];return (v===null||v===undefined)?'':v;});})); taiXuong(name,aoa).then(function(){toast('Da xuat file Excel: '+name);}).catch(function(e){toast(e.message);});}
function xuatVung(){var aoa=[['Ma vung','Ten vung','Cost Center SAP','KC ve Farm (km)','DT vung (ha)','DT co (ha)']].concat(VUNG.map(function(v){return [v.MaVung,v.TenVung,v.CostCenterSAP,v.KhoangCachVeFarm_Km,v.DienTichVung_ha,v.DienTichCo_ha];})); taiXuong('Vung',aoa).then(function(){toast('Da xuat file Excel: Vung');}).catch(function(e){toast(e.message);});}
function xuatLo(){var aoa=[['Ma lo','Ma vung','Cay trong','Dien tich (ha)','Giong','Trang thai ban do','Trang thai canh tac']].concat(LO.map(function(l){return [l.MaLo,l.MaVung,l.CayTrong,l.DienTich_ha,l.Giong,l.TrangThaiBanDo,l.TrangThaiCanhTac];})); taiXuong('Lo',aoa).then(function(){toast('Da xuat file Excel: Lo');}).catch(function(e){toast(e.message);});}
function nutXuat(label,fn){return '<button class="btn sec small" onclick="'+fn+'">⬇ Xuat Excel</button>';}

/* Ban do — Leaflet lazy */
function ensureLeaflet(){return new Promise(function(res,rej){ if(window.L) return res(); var s=document.createElement('script'); s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; s.onload=function(){res();}; s.onerror=function(){rej(new Error('Khong tai duoc Leaflet'));}; document.head.appendChild(s); });}
async function loadBanDo(){
  var el=document.getElementById('pg-bando');
  el.innerHTML='<div class="demo-note">Polygon MINH HỌA theo diện tích thật của từng lô, vị trí chưa phải ranh đo đạc — chờ file ranh vùng từ địa chính (CauHinh: Cho file ranh vung).</div><div id="map" style="margin-top:16px"></div><div class="legend"><span><i class="sw" style="background:#2f9e44"></i>Cỏ</span><span><i class="sw" style="background:#e8a13a"></i>Ngô</span><span>Bấm polygon để xem chi tiết lô · Chuyển lớp nền: vệ tinh Esri / bản đồ OSM ở góc phải bản đồ</span></div>';
  try{ await ensureLeaflet(); }catch(e){ el.innerHTML+='<div class="demo-note">'+esc(e.message)+'</div>'; return; }
  if(MAP_INIT && MAP_OBJ){ setTimeout(function(){ MAP_OBJ.invalidateSize(); },80); return; }
  var center=[19.62,105.62];
  MAP_OBJ=L.map('map').setView(center,12);
  var esri=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Esri World Imagery',maxZoom:19});
  var osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19});
  esri.addTo(MAP_OBJ); L.control.layers({'Vệ tinh (Esri)':esri,'Bản đồ (OSM)':osm}).addTo(MAP_OBJ);
  /* Grid layout: 5 cols, rect per lot sized by sqrt(area) */
  var colsN=5, gapM=60;
  var cellMax=0; LO.forEach(function(l){var s=Math.sqrt((Number(l.DienTich_ha)||1)*10000); if(s>cellMax)cellMax=s;});
  var stepM=cellMax+gapM;
  var totalW=colsN*stepM, rowsN=Math.ceil(LO.length/colsN), totalH=rowsN*stepM;
  var lat0=center[0], lng0=center[1];
  function mToLat(m){return m/111320;} function mToLng(m){return m/(111320*Math.cos(lat0*Math.PI/180));}
  var startLat=lat0+mToLat(totalH/2), startLng=lng0-mToLng(totalW/2);
  LO.forEach(function(l,idx){
    var side=Math.sqrt((Number(l.DienTich_ha)||1)*10000);
    var cx=startLng+mToLng((idx%colsN)*stepM+stepM/2), cy=startLat-mToLat(Math.floor(idx/colsN)*stepM+stepM/2);
    var dLat=mToLat(side/2), dLng=mToLng(side/2);
    var bounds=[[cy-dLat,cx-dLng],[cy+dLat,cx+dLng]];
    var isCo=String(l.CayTrong||'').toLowerCase().indexOf('cỏ')>=0||String(l.CayTrong||'').toLowerCase().indexOf('co')>=0&&String(l.CayTrong||'').toLowerCase().indexOf('ngô')<0;
    var isNgo=String(l.CayTrong||'').toLowerCase().indexOf('ngô')>=0||String(l.CayTrong||'').toLowerCase().indexOf('ngo')>=0;
    var color=isNgo?'#e8a13a':'#2f9e44';
    var tenVung=''; VUNG.forEach(function(v){if(v.MaVung===l.MaVung)tenVung=v.TenVung;});
    var poly=L.rectangle(bounds,{color:color,weight:2,fillColor:color,fillOpacity:0.45}).addTo(MAP_OBJ);
    poly.bindTooltip(esc(l.MaLo),{permanent:true,direction:'center',className:'lo-label'});
    poly.bindPopup('<b>'+esc(l.MaLo)+' · '+esc(tenVung)+'</b><br>Cây trồng: '+esc(l.CayTrong)+'<br>Diện tích: '+fmt(l.DienTich_ha,2)+' ha<br>Trạng thái canh tác: '+esc(l.TrangThaiCanhTac||''));
  });
  MAP_INIT=true;
  setTimeout(function(){ MAP_OBJ.invalidateSize(); },120);
}
